    <ellipse rx="18" ry="11" fill="#e8d7b8" stroke="#6b4230" stroke-width="4"/>
    <rect x="-6" y="6" width="12" height="16" rx="5" fill="#f0e4cc" stroke="#6b4230" stroke-width="4"/>
  </g>
  <!-- 肉丸 -->
  <circle cx="292" cy="152" r="14" fill="#b5562f" stroke="#6b4230" stroke-width="4"/>
  <circle cx="288" cy="148" r="5" fill="#d98a6a"/>
  <!-- 玉米段 -->
