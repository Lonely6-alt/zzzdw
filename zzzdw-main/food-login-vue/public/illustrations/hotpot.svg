<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2ef"/><stop offset="1" stop-color="#ffc4b8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="58" cy="64" r="16" fill="#fff" opacity=".4"/>
  <circle cx="348" cy="88" r="10" fill="#fff" opacity=".3"/>
  <circle cx="332" cy="238" r="18" fill="#fff" opacity=".22"/>
  <!-- 热气 -->
  <g stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" opacity=".75">
    <path d="M150 82 q-14 -16 0 -32 q14 -16 0 -28"/>
    <path d="M200 70 q-14 -16 0 -32 q14 -16 0 -26"/>
    <path d="M250 82 q-14 -16 0 -32 q14 -16 0 -28"/>
  </g>
  <!-- 锅 -->
