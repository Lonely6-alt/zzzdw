  </g>
  <g fill="#ffd23c" opacity=".9">
    <circle cx="146" cy="150" r="3"/><circle cx="124" cy="150" r="3"/>
  </g>
  <!-- 清汤侧食材 -->
  <!-- 蘑菇 -->
