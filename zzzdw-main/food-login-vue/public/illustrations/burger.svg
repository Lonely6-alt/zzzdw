<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7df"/><stop offset="1" stop-color="#ffdf94"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="56" cy="66" r="16" fill="#fff" opacity=".45"/>
  <circle cx="350" cy="84" r="10" fill="#fff" opacity=".35"/>
  <circle cx="336" cy="240" r="20" fill="#fff" opacity=".25"/>
  <!-- 汉堡 -->
  <g transform="translate(200,150)">
    <!-- 上层面包 -->
    <path d="M-95 -22 Q-95 -108 0 -108 Q95 -108 95 -22 Z" fill="#f0a83e" stroke="#6b4230" stroke-width="6" stroke-linejoin="round"/>
    <!-- 芝麻 -->
    <g fill="#fff3d6">
      <ellipse cx="-46" cy="-70" rx="6" ry="3.5" transform="rotate(-25 -46 -70)"/>
      <ellipse cx="-10" cy="-88" rx="6" ry="3.5" transform="rotate(10 -10 -88)"/>
      <ellipse cx="30" cy="-72" rx="6" ry="3.5" transform="rotate(30 30 -72)"/>
      <ellipse cx="60" cy="-46" rx="6" ry="3.5" transform="rotate(-15 60 -46)"/>
      <ellipse cx="-70" cy="-44" rx="6" ry="3.5" transform="rotate(20 -70 -44)"/>
    </g>
    <!-- 生菜 -->
    <path d="M-100 -20 q20 22 40 0 q20 22 40 0 q20 22 40 0 q20 22 40 0 q20 22 40 0 l0 14 q-100 20 -200 0Z" fill="#7cc34a" stroke="#6b4230" stroke-width="5" stroke-linejoin="round"/>
    <!-- 番茄 -->
    <rect x="-92" y="0" width="184" height="18" rx="9" fill="#e8503f" stroke="#6b4230" stroke-width="5"/>
    <!-- 芝士 -->
    <path d="M-90 20 L90 20 L78 44 L54 32 L30 48 L6 34 L-20 48 L-46 32 L-72 46 Z" fill="#ffc933" stroke="#6b4230" stroke-width="5" stroke-linejoin="round"/>
    <!-- 肉饼 -->
    <rect x="-92" y="42" width="184" height="30" rx="15" fill="#8a4a2b" stroke="#6b4230" stroke-width="5"/>
    <!-- 下面包 -->
    <path d="M-92 72 Q0 96 92 72 Q92 110 0 110 Q-92 110 -92 72Z" fill="#e89a35" stroke="#6b4230" stroke-width="6" stroke-linejoin="round"/>
  </g>
  <!-- 薯条 -->
  <g transform="translate(60,232)">
    <g stroke="#6b4230" stroke-width="4">
      <rect x="-24" y="-40" width="11" height="46" rx="3" fill="#ffcf54"/>
      <rect x="-8" y="-52" width="11" height="58" rx="3" fill="#ffcf54"/>
      <rect x="8" y="-44" width="11" height="50" rx="3" fill="#ffcf54"/>
      <rect x="24" y="-34" width="11" height="40" rx="3" fill="#ffcf54"/>
    </g>
    <path d="M-34 -8 L34 -8 L28 26 Q0 34 -28 26Z" fill="#e8503f" stroke="#6b4230" stroke-width="5" stroke-linejoin="round"/>
  </g>
</svg>