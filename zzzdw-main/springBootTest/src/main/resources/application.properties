spring.application.name=springBootTest
spring.profiles.active=dev

# ---------- MySQL 数据源（美食社区 food_db）----------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/food_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# ---------- MyBatis-Plus ----------
# 下划线列名自动映射驼峰属性（password_hash -> passwordHash）
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 控制台打印 SQL，方便调试
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.banner=false
# 主键采用数据库自增
mybatis-plus.global-config.db-config.id-type=auto

# ---------- JWT 配置 ----------
# 签名密钥（HMAC-SHA256 要求至少 32 字节）；生产环境建议用环境变量 JWT_SECRET 覆盖，不写死在代码里
jwt.secret=food-login-springboot-mybatis-plus-jwt-secret-2026
# token 有效期（天）
jwt.expire-days=7

